name: Custom Windows 10 QEMU (i7-10700K, 16GB RAM, Auto-Installed 3D & Source Engine Suite)

on:
  workflow_dispatch:

jobs:
  run-win10-qemu:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM & Storage Tools
        run: |
          echo "=== [STEP 1/5] Installing QEMU, KVM & Storage Tools ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            novnc \
            websockify \
            curl \
            wget \
            aria2 \
            dosfstools \
            mtools \
            genisoimage \
            unzip

          echo "=== Enabling KVM Permissions ==="
          sudo chmod 666 /dev/kvm || true

          echo "=== Creating Main Virtual Disk (500GB qcow2) ==="
          qemu-img create -f qcow2 /tmp/main_disk.qcow2 500G

      - name: 2. Download Windows 10 ISO
        run: |
          echo "=== [STEP 2/5] Downloading Windows 10 ISO ==="
          
          ISO_URL="https://archive.org/download/en_windows_10_enterprise_g/en_windows_10_enterprise_g_22h2_build_19045.3570.iso"
          
          echo "Downloading ISO to /tmp/win10.iso..."
          aria2c -x 4 -s 4 -k 1M -d /tmp -o win10.iso "$ISO_URL" || wget -O /tmp/win10.iso "$ISO_URL"
          
          ls -lh /tmp/win10.iso

      - name: 3. Prepare Auto-Installing 3D & Source Engine Runtimes Package
        run: |
          echo "=== [STEP 3/5] Downloading 3D Components & Auto-Install Setup ==="
          
          mkdir -p /tmp/win_extras
          
          # Точная рабочая ссылка на DirectX 9.0c redist от Microsoft
          DIRECTX_URL="https://download.microsoft.com/download/8/4/a/84a35bf1-dafe-4ae8-82af-ad2ae20b6b14/directx_Jun2010_redist.exe"
          VCREDIST_URL="https://github.com/abbodi1406/vcredist/releases/download/v0.80.0/VisualCppRedist_AIO_x86_x64.zip"
          MESA3D_URL="https://github.com/pal1000/mesa-dist-win/releases/download/21.3.9/mesa3d-21.3.9-release-msvc.exe"
          
          echo "Downloading DirectX 9.0c Full Redistributable (Direct Link)..."
          wget --tries=5 --timeout=30 -O /tmp/win_extras/directx_redist.exe "$DIRECTX_URL" || curl -L -o /tmp/win_extras/directx_redist.exe "$DIRECTX_URL"
          
          echo "Downloading VC++ Runtimes (All-in-One 2005-2022) from GitHub..."
          wget --tries=5 --timeout=30 -O /tmp/win_extras/vcredist.zip "$VCREDIST_URL" || curl -L -o /tmp/win_extras/vcredist.zip "$VCREDIST_URL"

          echo "Downloading Mesa3D OpenGL Driver Pack from GitHub..."
          wget --tries=5 --timeout=30 -O /tmp/win_extras/mesa3d_setup.exe "$MESA3D_URL" || true

          # Автоматический скрипт установки
          cat << 'EOF' > /tmp/win_extras/autorun_install.bat
          @echo off
          echo Unpacking and Installing DirectX 9.0c...
          mkdir "%TEMP%\dx_extract"
          "%~dp0directx_redist.exe" /Q /T:"%TEMP%\dx_extract"
          call "%TEMP%\dx_extract\DXSETUP.exe" /silent

          echo Unpacking and Installing VC++ Runtimes...
          if exist "%~dp0vcredist.zip" (
              powershell -Command "Expand-Archive -Path '%~dp0vcredist.zip' -DestinationPath '%TEMP%\vcredist' -Force"
              call "%TEMP%\vcredist\VisualCppRedist_AIO_x86_x64.exe" /y
          )
          echo All Runtimes successfully pre-installed!
          EOF

          echo "Creating ISO image with Extras..."
          genisoimage -V "WIN_EXTRAS" -J -R -o /tmp/extras_disk.iso /tmp/win_extras

          ls -lh /tmp/extras_disk.iso

      - name: 4. Connect Tailscale
        run: |
          echo "=== [STEP 4/5] Connecting Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh
          
          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="win10-qemu-runner-${{ github.run_id }}" \
            --accept-routes || true
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4 || true)
              sleep 3
              RETRIES=$((RETRIES+1))
          done
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 5. Launch QEMU Windows 10 & noVNC Web Access
        run: |
          echo "=== [STEP 5/5] Starting QEMU Windows 10 Machine ==="
          
          qemu-system-x86_64 \
            -enable-kvm \
            -m 16384 \
            -smp 16,sockets=1,cores=8,threads=2 \
            -cpu Skylake-Client,vendor=GenuineIntel,modelname="Intel(R) Core(TM) i7-10700K CPU @ 3.80GHz" \
            -drive file=/tmp/main_disk.qcow2,format=qcow2,index=0,media=disk \
            -drive file=/tmp/win10.iso,index=1,media=cdrom \
            -drive file=/tmp/extras_disk.iso,index=2,media=cdrom \
            -vga std \
            -boot d \
            -vnc 127.0.0.1:0 \
            -net nic,model=e1000 \
            -net user \
            -usb -device usb-tablet \
            -daemonize

          sleep 5

          NOVNC_DIR="/usr/share/novnc"
          if [ -d "/usr/share/novnc/vnc_lite.html" ] || [ -f "/usr/share/novnc/vnc.html" ] || [ -f "/usr/share/novnc/index.html" ]; then
            NOVNC_DIR="/usr/share/novnc"
          elif [ -d "/usr/share/novnc" ]; then
            NOVNC_DIR="/usr/share/novnc"
          fi

          websockify --web "$NOVNC_DIR" 8006 127.0.0.1:5900 &
          sleep 2

          echo "=================================================="
          echo " WINDOWS 10 QEMU READY (SOURCE ENGINE PRE-LOADED)"
          echo "=================================================="
          echo " OS Image     : Windows 10 Enterprise G (22H2)"
          echo " CPU Model    : Intel(R) Core(TM) i7-10700K CPU @ 3.80GHz"
          echo " RAM          : 16 GB (16384 MB)"
          echo " Extras Drive : DirectX 9.0c (Working Microsoft Link) + VC++"
          echo " Tailscale IP : $TAILSCALE_IP"
          echo " Web VNC URL  : http://$TAILSCALE_IP:8006/vnc.html"
          echo "=================================================="

          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "QEMU Running | Tailscale IP: $TAILSCALE_IP | $(date)"
          done

